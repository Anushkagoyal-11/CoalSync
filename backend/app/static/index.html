    // --- Main App Component ---

        <div className="min-h-screen flex flex-col bg-slate-100 text-slate-900">

                  />
                </div>
              </div>
              
              <div className="flex space-x-1 border-t border-slate-800 pt-0.5">
                <button onClick={() => setActiveTab('command')} className={`py-2 px-3 text-xs font-semibold border-b-2 ${activeTab === 'command' ? 'border-blue-500 text-blue-400 bg-slate-800/80' : 'border-transparent text-slate-400 hover:text-slate-200'}`}>Command Center</button>

                <button onClick={() => setActiveTab('cctv')} className={`py-2 px-3 text-xs font-semibold border-b-2 ${activeTab === 'cctv' ? 'border-blue-500 text-blue-400 bg-slate-800/80' : 'border-transparent text-slate-400 hover:text-slate-200'}`}>CCTV Checkpoint CP-01</button>
              </div>
            </div>
          </header>

          {/* Operational Metrics KPI Bar */}

            <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">

    // --- Sub-Component: MapLibre GIS Component ---
    function MapViewComponent({ locations, shipments, onSelect }) {
      const containerRef = useRef(null);
      const mapRef = useRef(null);

      useEffect(() => {
        if (!containerRef.current) return;
        const map = new maplibregl.Map({
          container: containerRef.current,
          style: {
            version: 8,
            sources: { 'osm-tiles': { type: 'raster', tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'], tileSize: 256 } },
            layers: [{ id: 'osm-tiles-layer', type: 'raster', source: 'osm-tiles' }]
          },
          center: [82.5000, 22.8000],
          zoom: 5.5
        });
        map.addControl(new maplibregl.NavigationControl(), 'top-right');
        mapRef.current = map;

        // Render Locations
        locations.forEach(loc => {
          const el = document.createElement('div');
          let bg = 'bg-slate-800 text-white';
          if (loc.type === 'MINE') bg = 'bg-stone-800 text-amber-400 border border-stone-600';
          if (loc.type === 'SIDING') bg = 'bg-blue-600 text-white border border-blue-400';
          if (loc.type === 'CHECKPOINT') bg = 'bg-emerald-600 text-white border border-emerald-400';
          if (loc.type === 'PLANT') bg = loc.inventory_hours <= 10 ? 'bg-red-600 text-white border border-red-300 animate-pulse' : 'bg-amber-600 text-white border border-amber-300';
          
          el.className = `${bg} px-1.5 py-0.5 rounded text-[10px] font-bold shadow flex items-center gap-1 cursor-pointer`;
          el.innerHTML = `<span>${loc.code}</span>`;
          new maplibregl.Marker({ element: el }).setLngLat([loc.lng, loc.lat]).addTo(map);
        });

        // Render Shipments
        shipments.forEach(s => {
          const el = document.createElement('div');
          const isCritical = s.priority.score >= 81;
          const bg = isCritical ? 'bg-red-600' : 'bg-blue-600';
          el.className = `${bg} text-white font-bold text-[10px] px-2 py-0.5 rounded-full shadow border border-white cursor-pointer`;
          el.innerHTML = `🚚 ${s.id} (${s.priority.score})`;
          el.addEventListener('click', () => onSelect(s));
          new maplibregl.Marker({ element: el }).setLngLat([s.current_coords[1], s.current_coords[0]]).addTo(map);
        });

        return () => map.remove();
      }, [locations, shipments]);

      return (
        <div className="relative w-full h-[460px] rounded border border-slate-300">
          <div ref={containerRef} className="w-full h-full" />
        </div>
      );
    }

    // --- Sub-Component: Priority Queue Component ---
    function PriorityQueueComponent({ shipments, onSelect }) {
      return (

            </div>
            <span className="bg-slate-200 text-slate-700 text-xs font-semibold px-2 py-0.5 rounded font-mono">{shipments.length} Active</span>
          </div>

          <div className="divide-y divide-slate-100 max-h-[440px] overflow-y-auto">
            {shipments.map((s, idx) => {
              const isHero = s.id === 'CS-184';
              const isCritical = s.priority.score >= 81;
              return (
                <div key={s.id} onClick={() => onSelect(s)} className={`p-3 hover:bg-slate-50 transition cursor-pointer flex flex-col sm:flex-row sm:items-center justify-between gap-2 ${isHero ? 'bg-red-50/50 border-l-4 border-l-red-600' : ''}`}>
                  <div className="flex items-start gap-3">
                    <span className="text-xs font-mono font-bold text-slate-400 w-6 pt-0.5">#{idx + 1}</span>
                    <div>
                      <div className="flex items-center gap-2">
                        <span className="font-bold text-sm text-slate-900">{s.id}</span>
                        {isHero && <span className="bg-red-600 text-white text-[9px] font-bold px-1.5 py-0.2 rounded">DEMO HERO</span>}
                        <span className={`text-[10px] font-bold px-2 py-0.5 rounded ${isCritical ? 'bg-red-100 text-red-800 border border-red-200' : 'bg-amber-100 text-amber-900 border border-amber-200'}`}>
                          {s.priority.score}/100 • {s.priority.classification}
                        </span>
                      </div>
                      <div className="text-xs text-slate-600 mt-0.5">
                        From: <strong>{s.origin}</strong> → To: <strong>{s.destination}</strong> ({s.transport_mode})
                      </div>
                      <div className="flex flex-wrap items-center gap-2 mt-1.5 text-[10px] font-mono text-slate-600">
                        <span className="bg-slate-100 px-1.5 py-0.5 rounded border">Stock: <strong className={s.destination_inventory_hours <= 10 ? 'text-red-600' : ''}>{s.destination_inventory_hours}h</strong></span>
                        <span className="bg-slate-100 px-1.5 py-0.5 rounded border">Delay: <strong className={s.delay_minutes > 60 ? 'text-amber-700' : ''}>{Math.floor(s.delay_minutes/60)}h {s.delay_minutes%60}m</strong></span>
                        <span className="bg-slate-100 px-1.5 py-0.5 rounded border">Qty: <strong>{s.quantity_tonnes}t</strong></span>
                      </div>
                    </div>
                  </div>
                  <div className="flex items-center justify-between sm:justify-end gap-3 pt-2 sm:pt-0 border-t sm:border-0 border-slate-100">
                    <div className="text-right">
                      <span className="text-xs font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-200">CCTV Verified</span>
                      <div className="text-[10px] text-slate-400 font-mono mt-0.5">Vehicle: {s.vehicle_id || 'N/A'}</div>
                    </div>
                    <button onClick={(e) => { e.stopPropagation(); onSelect(s); }} className="bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs px-3 py-1.5 rounded">
                      Inspect Trail &rarr;
                    </button>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // --- Sub-Component: CCTV View Component ---
    function CCTVViewComponent({ heroShipment, onInspect }) {
      const [verifying, setVerifying] = useState(false);
      return (
        <div className="bg-white rounded border border-slate-300 p-4 space-y-4">
          <div className="flex items-center justify-between pb-3 border-b border-slate-200">
            <div>
              <h2 className="text-sm font-bold uppercase tracking-wider text-slate-900">CCTV Camera Checkpoint CP-01 (Mahanadi Corridor)</h2>
              <p className="text-xs text-slate-500">Live AI Vehicle Detection & Physical Consignment Verification</p>
            </div>
            <button onClick={() => { setVerifying(true); setTimeout(() => setVerifying(false), 800); }} className="bg-amber-600 text-white text-xs font-bold px-3 py-1.5 rounded">
              {verifying ? 'Scanning Feed...' : 'Re-scan Camera Feed'}
            </button>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
            <div className="lg:col-span-2 bg-slate-950 rounded aspect-video relative flex flex-col justify-between p-3 border-2 border-slate-800">
              <div className="absolute inset-0 flex items-center justify-center">
                <div className="w-72 h-44 border-2 border-emerald-400 bg-emerald-500/10 rounded p-3 flex flex-col justify-between">
                  <div className="bg-emerald-600 text-white text-[10px] font-mono font-bold px-2 py-0.5 rounded w-max">TRUCK DETECTED (Conf: 94%)</div>
                  <div className="text-center font-mono">
                    <div className="text-lg font-bold text-emerald-400">OD-14-B-1840</div>
                    <div className="text-xs text-slate-300">Matched Manifest: CS-184</div>
                  </div>
                  <div className="flex justify-between text-[10px] font-mono text-emerald-400">
                    <span>Checkpoint CP-01</span>
                    <span>Speed: 38 km/h</span>
                  </div>
                </div>
                <div className="absolute inset-x-0 h-0.5 bg-amber-400 animate-radar"></div>
              </div>
              <div className="relative z-10 flex justify-between text-xs font-mono text-white bg-slate-900/80 px-2 py-1 rounded">
                <span>REC • 1080p 60FPS • CAM-CP-01</span>
                <span>2026-08-16 10:45:00</span>
              </div>
              <div className="relative z-10 bg-slate-900/90 text-white text-xs p-2 rounded flex justify-between items-center font-mono">
                <span>PLATE: OD-14-B-1840 (Confidence 94.0%)</span>
                <span className="bg-emerald-600 text-white text-[10px] px-2 py-0.5 rounded font-bold">VERIFIED</span>
              </div>
            </div>

            <div className="space-y-3 bg-slate-50 p-4 rounded border border-slate-200">
              <div className="bg-emerald-50 border border-emerald-200 p-3 rounded text-xs text-emerald-900">
                <strong className="block text-emerald-800 font-bold mb-1">PHYSICALLY VERIFIED EVENT</strong>
                Camera CAM-CP-01 verified vehicle <strong>OD-14-B-1840</strong> passing Checkpoint CP-01. Event logged to <strong>Verified Digital Coal Trail</strong> for CS-184.
              </div>
              <div className="space-y-2 text-xs font-mono">
                <div className="flex justify-between border-b pb-1"><span>Shipment:</span><strong className="text-blue-700">CS-184</strong></div>
                <div className="flex justify-between border-b pb-1"><span>Vehicle License:</span><strong>OD-14-B-1840</strong></div>
                <div className="flex justify-between border-b pb-1"><span>AI Confidence:</span><strong className="text-emerald-700">94.0%</strong></div>
                <div className="flex justify-between"><span>Source:</span><span className="bg-white px-1.5 py-0.5 border rounded">CCTV_CAM_CP01</span></div>
              </div>
              <button onClick={() => onInspect(heroShipment)} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs py-2 rounded">
                Inspect CS-184 Coal Trail
              </button>
            </div>
          </div>
        </div>
      );
    }

    // --- Sub-Component: Event Feed Component ---
    function EventFeedComponent({ onSelectId }) {
      const [events, setEvents] = useState([
        { id: "1", time: "10:45:00", loc: "Mahanadi CP-01", type: "CCTV Physical Verification", details: "Truck OD-14-B-1840 matched CS-184 (94%)", verified: true },
        { id: "2", time: "07:15:00", loc: "Talcher Weighbridge WB-04", type: "Gross Weight Measured", details: "Net Coal: 32.0t (CS-184)", verified: true },
        { id: "3", time: "06:00:00", loc: "Talcher Mine A Loading Bay", type: "Consignment Dispatched", details: "GPS Lock Engaged", verified: true }
      ]);

      return (
        <div className="bg-white rounded border border-slate-300 p-3">
          <div className="flex items-center justify-between border-b pb-2 mb-2">
            <h3 className="text-xs font-bold uppercase tracking-wider text-slate-800">Live Multimodal Event Log</h3>
            <span className="text-[10px] font-mono bg-slate-100 px-1.5 py-0.5 rounded border">Polling Active</span>
          </div>
          <div className="space-y-2 max-h-[300px] overflow-y-auto">
            {events.map(ev => (
              <div key={ev.id} className="p-2 rounded bg-slate-50 border border-slate-200 text-xs space-y-0.5">
                <div className="flex justify-between font-bold text-slate-900">
                  <span>{ev.type}</span>
                  <span className="font-mono text-[10px] text-slate-400">{ev.time}</span>
                </div>
                <div className="text-[11px] text-slate-600">{ev.loc}</div>
                <p className="text-[10px] font-mono text-slate-500 bg-white p-1 rounded border">{ev.details}</p>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // --- Sub-Component: Shipment Modal Component ---
    function ShipmentModalComponent({ shipment, onClose, onOpenCCTV }) {
      const isHero = shipment.id === 'CS-184';
      return (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
          <div className="bg-white rounded-lg border border-slate-300 max-w-3xl w-full max-h-[90vh] flex flex-col overflow-hidden shadow-2xl">
            <div className="p-4 bg-slate-900 text-white flex items-center justify-between border-b border-slate-800">
              <div>
                <div className="flex items-center gap-2">
                  <h3 className="text-lg font-extrabold">{shipment.id}</h3>
                  {isHero && <span className="bg-red-600 text-white text-[10px] font-bold px-2 py-0.5 rounded">HERO CONSIGNMENT</span>}
                </div>
                <p className="text-xs text-slate-300 mt-0.5">{shipment.origin} → {shipment.destination} ({shipment.transport_mode})</p>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-white font-bold text-lg px-2">✕</button>
            </div>

            <div className="p-5 overflow-y-auto space-y-5 flex-1">
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 bg-slate-50 p-3 rounded border border-slate-200 text-xs">
                <div><span className="text-slate-500">Quantity:</span> <strong className="block text-slate-900">{shipment.quantity_tonnes} tonnes</strong></div>
                <div><span className="text-slate-500">Destination Stock:</span> <strong className="block text-red-600">{shipment.destination_inventory_hours} hours</strong></div>
                <div><span className="text-slate-500">ETA Delay:</span> <strong className="block text-amber-700">+{Math.floor(shipment.delay_minutes/60)}h {shipment.delay_minutes%60}m</strong></div>
                <div><span className="text-slate-500">Current Location:</span> <strong className="block text-slate-900 truncate">{shipment.current_location}</strong></div>
              </div>

              <div className="p-3.5 rounded border border-red-200 bg-red-50/70">
                <h4 className="text-xs font-bold text-red-900 uppercase">AI Priority Score: {shipment.priority.score}/100 ({shipment.priority.classification})</h4>
                <p className="text-xs text-slate-700 mt-1">{shipment.priority.explanation_text}</p>
              </div>

              <div>
                <div className="flex items-center justify-between mb-3 border-b pb-1">
                  <h4 className="text-xs font-bold uppercase tracking-wider text-slate-900">Verified Digital Coal Trail</h4>
                  <button onClick={onOpenCCTV} className="text-xs text-blue-700 font-bold hover:underline">View Checkpoint CCTV &rarr;</button>
                </div>

                <div className="space-y-3 pl-4 border-l-2 border-slate-200">
                  {shipment.events && shipment.events.map((ev, idx) => (
                    <div key={ev.id} className="relative text-xs">
                      <div className="absolute -left-[23px] top-1 h-3 w-3 rounded-full bg-emerald-600 border border-white"></div>
                      <div className="bg-slate-50 p-3 rounded border border-slate-200">
                        <div className="flex justify-between font-bold text-slate-900">
                          <span>{ev.event_type}</span>
                          <span className="font-mono text-[10px] text-slate-400">{ev.timestamp}</span>
                        </div>
                        <div className="text-slate-600 mt-0.5">{ev.location} • SOURCE: {ev.source}</div>
                        {ev.verified && <span className="inline-block mt-1 bg-emerald-100 text-emerald-800 text-[10px] font-bold px-1.5 py-0.5 rounded border border-emerald-200">PHYSICALLY VERIFIED</span>}
                        {ev.verification_details && <p className="mt-1 font-mono text-[10px] text-slate-500 bg-white p-1 rounded border">{ev.verification_details}</p>}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>

            <div className="p-3 bg-slate-50 border-t border-slate-200 flex justify-between items-center text-xs">
              <span className="font-mono text-slate-600">Vehicle: {shipment.vehicle_id || 'OD-14-B-1840'}</span>
              <button onClick={onClose} className="bg-slate-800 text-white font-bold px-3 py-1.5 rounded">Close</button>
            </div>
          </div>
        </div>
      );
    }

    // Render Root
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
